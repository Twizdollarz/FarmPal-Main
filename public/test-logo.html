<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FarmPal Logo Vector Test</title>
  <style>
    body { background: #fbf9f5; font-family: sans-serif; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
    .box { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .dark { background: #064e3b; }
  </style>
</head>
<body>
  <h2>FarmPal Vector Logo Fidelity Test</h2>

  <div class="box">
    <p style="font-size: 12px; color: #888; margin-bottom: 8px;">Light Background (Matches User Screenshot)</p>
    <svg width="400" height="120" viewBox="0 0 380 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Color: #3ca83b (Official FarmPal Vibrant Green) -->
      <g fill="#3ca83b">
        <!-- Left Head -->
        <circle cx="28" cy="25" r="10" />
        <!-- Right Head -->
        <circle cx="70" cy="25" r="10" />
        <!-- Left Figure Body (Wraps around bottom) -->
        <path d="M 24 40 C 16 42 12 50 12 60 L 12 72 C 12 82 18 89 30 89 L 58 89 C 70 89 78 84 80 75 C 81 68 76 65 67 67 L 50 71 C 41 73 34 68 33 58 L 33 48 C 33 43 28 40 24 40 Z" />
        <!-- Right Figure Body (Arms reaching into embrace) -->
        <path d="M 64 40 C 58 42 52 46 44 51 L 38 55 C 33 59 34 65 40 65 C 47 65 54 60 62 55 L 68 51 C 72 48 76 50 76 55 L 76 63 C 76 68 81 70 84 66 C 86 63 86 54 86 48 C 86 42 80 40 72 40 L 64 40 Z" />
      </g>

      <!-- Wordmark: Farmpal -->
      <g fill="#3ca83b" transform="translate(105, 0)">
        <text x="0" y="74" font-family="'Nunito', 'Comfortaa', 'Quicksand', 'Inter', -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.5px">Farmpal</text>
      </g>
    </svg>
  </div>

  <div class="box dark">
    <p style="font-size: 12px; color: #a7f3d0; margin-bottom: 8px;">Dark Header Background (Emerald 950)</p>
    <svg width="400" height="120" viewBox="0 0 380 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g fill="#4ade80">
        <circle cx="28" cy="25" r="10" />
        <circle cx="70" cy="25" r="10" />
        <path d="M 24 40 C 16 42 12 50 12 60 L 12 72 C 12 82 18 89 30 89 L 58 89 C 70 89 78 84 80 75 C 81 68 76 65 67 67 L 50 71 C 41 73 34 68 33 58 L 33 48 C 33 43 28 40 24 40 Z" />
        <path d="M 64 40 C 58 42 52 46 44 51 L 38 55 C 33 59 34 65 40 65 C 47 65 54 60 62 55 L 68 51 C 72 48 76 50 76 55 L 76 63 C 76 68 81 70 84 66 C 86 63 86 54 86 48 C 86 42 80 40 72 40 L 64 40 Z" />
      </g>
      <g fill="#ffffff" transform="translate(105, 0)">
        <text x="0" y="74" font-family="'Nunito', 'Comfortaa', 'Quicksand', 'Inter', -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.5px">Farmpal</text>
      </g>
    </svg>
  </div>
</body>
</html>
